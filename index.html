<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keystone — Jones Numerology</title>
<style>
  :root{--bg:#0e0f14;--card:#171a22;--line:#2a2f3a;--txt:#e8eaf0;--dim:#8b90a0;--acc:#c9a227;--acc2:#7c5cbf}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
  header{padding:18px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  header h1{margin:0;font-size:20px;letter-spacing:.5px}
  header p{margin:2px 0 0;color:var(--dim);font-size:12px}
  main{max-width:640px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0c0e14;color:var(--txt);font-size:16px}
  button{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--acc),#a8841f);color:#1a1400;font-weight:700;font-size:16px;margin-top:14px;cursor:pointer}
  button.sec{background:transparent;border:1px solid var(--line);color:var(--txt);margin-top:8px}
  .core{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
  .core:last-child{border:0}
  .core .n{font-size:22px;font-weight:700;color:var(--acc)}
  .core .t{font-size:13px;color:var(--dim)}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--acc2);color:#fff;margin-left:6px}
  .reading{font-size:14px;color:#cdd2de}
  .reading b{color:var(--acc)}
  .small{font-size:12px;color:var(--dim)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  footer{text-align:center;color:var(--dim);font-size:11px;padding:20px}
</style>
</head>
<body>
<header>
  <h1>Keystone</h1>
  <p>Numerology · Jones method · everything stays on your device</p>
</header>
<main>
  <div class="card">
    <label>First name</label>
    <input id="fn" value="Judith">
    <label>Middle name</label>
    <input id="mn" value="Anne">
    <label>Last name</label>
    <input id="ln" value="Crighton">
    <div class="grid2">
      <div><label>Day</label><input id="d" value="27"></div>
      <div><label>Month</label><input id="m" value="12"></div>
    </div>
    <label>Year</label>
    <input id="y" value="1957">
    <button onclick="cast()">Cast this chart</button>
    <button class="sec" onclick="loadDemo()">Load demo</button>
  </div>
  <div id="out"></div>
</main>
<footer>Keystone · inspired by Dr. Steve G. Jones · self-help reflection only</footer>
<script>
const PY={A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,I:9,J:1,K:2,L:3,M:4,N:5,O:6,P:7,Q:8,R:9,S:1,T:2,U:3,V:4,W:5,X:6,Y:7,Z:8};
const VOW="AEIOU";
function red(n,keep){n=Math.abs(n);let g=n;while(g>9&&!(keep&&(g===11||g===22)))g=String(g).split("").reduce((a,b)=>a+ +b,0);return g;}
function nameVal(s,only){s=(s||"").toUpperCase().replace(/[^A-Z]/g,"");let t=0;for(const c of s){if(only=="v"&&!VOW.includes(c))continue;if(only=="c"&&VOW.includes(c))continue;t+=PY[c]||0;}return t;}
function parts(s){return (s||"").toUpperCase().split(/[\s-]+/).filter(Boolean);}
function reduceName(s,only){let tot=0;for(const p of parts(s)){tot+=red(nameVal(p,only));}return red(tot);}
function lp(d,m,y){const mm=red(m),dd=red(+d),yy=+y,yr=red(yy,true);return{mm,dd,yr,tot:mm+dd+yr,lp:red(mm+dd+yr,true)};}
function cast(){
  const fn=document.getElementById("fn").value,mn=document.getElementById("mn").value,ln=document.getElementById("ln").value;
  const d=+document.getElementById("d").value,m=+document.getElementById("m").value,y=+document.getElementById("y").value;
  const L=lp(d,m,y);
  const bd=red(d,true), bdc=red(d);
  const exp=reduceName(fn+" "+mn+" "+ln), sou=reduceName(fn+" "+mn+" "+ln,"v"), per=reduceName(fn+" "+mn+" "+ln,"c");
  const gr=red(nameVal(fn)), mat=red(L.lp+exp,true);
  const full=(fn+" "+mn+" "+ln).toUpperCase();
  let counts={};for(const c of full){if(PY[c])counts[PY[c]]=(counts[PY[c]]||0)+1;}
  const miss=[1,2,3,4,5,6,7,8,9].filter(n=>!counts[n]);
  const pass=Object.entries(counts).filter(([n,c])=>c>=3).map(([n])=>+n);
  const K={13:"effort without shortcuts",14:"abuse of freedom",16:"ego & humility",19:"abuse of power"};
  const karm=[];for(const p of parts(full)){const v=nameVal(p);if(K[v])karm.push(p+": "+K[v]);}
  const R={1:"Pioneer — you initiate. Lead, but learn to listen.",2:"Diplomat — you cooperate. Don't disappear into the room.",3:"Creator — you express. Channel it or it scatters.",4:"Builder — you structure. Don't become rigid.",5:"Messenger — you change. Freedom needs a chosen limit.",6:"Caretaker — you nurture. Keep a chair for yourself.",7:"Seeker — you study. Come back out with what you found.",8:"Power — you achieve. Power without compassion turns cold.",9:"Humanitarian — you complete. Finish, then release.",11:"Intuitive master — insight is real; ground it.",22:"Master builder — big visions, patient hands."};
  const tag=n=>n===11||n===22?'<span class="tag">master</span>':n===33?'<span class="tag">6 (33→6)</span>':"";
  let h=`<div class="card"><h3 style="margin:0 0 6px">The five core numbers</h3>
  <div class="core"><div><b>Life Path</b> ${tag(L.lp)}<div class="t">month ${L.mm} + day ${L.dd} + year ${L.yr}</div></div><div class="n">${L.tot}/${L.lp}</div></div>
  <div class="core"><div><b>Birthday</b><div class="t">compound ${bdc}, reduced ${bd}</div></div><div class="n">${bdc}/${bd}</div></div>
  <div class="core"><div><b>Expression</b><div class="t">every letter</div></div><div class="n">${exp}</div></div>
  <div class="core"><div><b>Soul Urge</b><div class="t">vowels</div></div><div class="n">${sou}</div></div>
  <div class="core"><div><b>Personality</b><div class="t">consonants</div></div><div class="n">${per}</div></div></div>`;
  h+=`<div class="card"><h3 style="margin:0 0 6px">Readings</h3>
  <p class="reading"><b>Life Path ${L.lp}.</b> ${R[L.lp]||""}</p>
  <p class="reading"><b>Expression ${exp}.</b> ${R[exp]||""}</p>
  <p class="reading"><b>Soul Urge ${sou}.</b> ${R[sou]||""}</p>
  <p class="reading"><b>Personality ${per}.</b> ${R[per]||""}</p>
  <p class="reading small">Growth (first name): ${gr}. Maturity: ${mat}. Hidden passion: ${pass.length?pass.join(", "):"none"}. Secret self (missing): ${miss.length?miss.join(", "):"none — no gaps."}</p>
  ${karm.length?`<p class="reading small"><b>Karmic lessons:</b> ${karm.join(" · ")}</p>`:""}</div>`;
  document.getElementById("out").innerHTML=h;
}
function loadDemo(){document.getElementById("fn").value="Judith";document.getElementById("mn").value="Anne";document.getElementById("ln").value="Crighton";document.getElementById("d").value="27";document.getElementById("m").value="12";document.getElementById("y").value="1957";cast();}
loadDemo();
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-label="Keystone numerology abstract hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0712"/>
      <stop offset="45%" stop-color="#120c1c"/>
      <stop offset="100%" stop-color="#07060b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#f3d36a" stop-opacity=".55"/>
      <stop offset="35%" stop-color="#c9a227" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#7c5cbf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d2"/>
      <stop offset="40%" stop-color="#e8c35a"/>
      <stop offset="100%" stop-color="#8a6410" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d27a"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#7c5cbf"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/>
  <circle cx="800" cy="310" r="280" fill="url(#glow)"/>
  <g fill="none" stroke="url(#ring)" stroke-width="1.2" opacity=".55">
    <circle cx="800" cy="310" r="86"/>
    <circle cx="800" cy="310" r="148"/>
    <circle cx="800" cy="310" r="210"/>
    <circle cx="800" cy="310" r="268"/>
  </g>
  <g fill="none" stroke="#c9a227" stroke-width="1" opacity=".35">
    <ellipse cx="800" cy="310" rx="268" ry="92"/>
    <ellipse cx="800" cy="310" rx="92" ry="268"/>
    <ellipse cx="800" cy="310" rx="210" ry="148" transform="rotate(30 800 310)"/>
    <ellipse cx="800" cy="310" rx="210" ry="148" transform="rotate(-30 800 310)"/>
  </g>
  <polygon points="800,100 990,420 610,420" fill="none" stroke="#7c5cbf" stroke-width="1" opacity=".28"/>
  <polygon points="800,520 610,200 990,200" fill="none" stroke="#c9a227" stroke-width="1" opacity=".22"/>
  <circle cx="800" cy="310" r="28" fill="url(#core)"/>
  <circle cx="800" cy="310" r="10" fill="#fff6d2"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#e8c97a" text-anchor="middle">
    <text x="180" y="200" font-size="72" opacity=".35">1</text>
    <text x="160" y="360" font-size="72" opacity=".32">3</text>
    <text x="200" y="520" font-size="72" opacity=".35">7</text>
    <text x="1420" y="200" font-size="72" opacity=".35">9</text>
    <text x="1440" y="360" font-size="64" opacity=".38">11</text>
    <text x="1420" y="520" font-size="64" opacity=".38">22</text>
  </g>
</svg>
